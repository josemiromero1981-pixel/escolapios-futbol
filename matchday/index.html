<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Escolapios Matchday</title>
<meta name="theme-color" content="#06110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchday">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{background:#06110d;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Albert+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: "estadio de noche" — portada con campo en perspectiva y focos; equipos y jugadores como cromos; columna única de 600px máx. */
:root{
  --night:#06110d; --turf:#0b2419; --turf2:#0f2f21; --panel:#10261c; --panel2:#163326;
  --chalk:#e4f4ea; --muted:#8eae9c; --line:rgba(228,244,234,.12);
  --esc:#3fd37a; --esc-ink:#04170c; --flood:#fff3cf; --gold:#f2c14e; --bad:#ff7a66; --warn:#f2a86b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--esc);outline-offset:3px;border-radius:8px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.press{transition:transform 160ms var(--ease-out)}
.press:active{transform:scale(.97)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.disp{font-family:var(--display);font-weight:900;letter-spacing:.01em;line-height:.92;text-transform:uppercase}
.beta{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);padding-block:10px 0}
.beta b{color:var(--gold);font-weight:700;letter-spacing:.1em}

/* ---------- Portada: estadio ---------- */
.hero{position:relative;overflow:hidden;isolation:isolate;padding-block:18px 26px;min-height:440px}
.stage{position:absolute;inset:0;z-index:-1;perspective:700px;perspective-origin:50% 0%}
.turf{position:absolute;left:50%;top:150px;width:780px;height:520px;margin-left:-390px;transform:rotateX(58deg);transform-origin:50% 0;
  background:repeating-linear-gradient(90deg,var(--turf) 0 60px,var(--turf2) 60px 120px);border-radius:6px;
  box-shadow:0 0 140px 50px rgba(63,211,122,.18)}
.turf svg{position:absolute;inset:0;width:100%;height:100%}
.chalk{fill:none;stroke:rgba(228,244,234,.9);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease-io) forwards}
.chalk.d2{animation-delay:.25s}.chalk.d3{animation-delay:.5s}.chalk.d4{animation-delay:.7s}
@keyframes draw{to{stroke-dashoffset:0}}
.fog{position:absolute;inset:0;background:linear-gradient(180deg,var(--night) 0%,rgba(6,17,13,.05) 34%,rgba(6,17,13,.35) 78%,var(--night) 100%)}
.beam{position:absolute;top:-60px;width:180px;height:620px;background:linear-gradient(180deg,rgba(255,243,207,.55),rgba(255,243,207,0) 75%);
  filter:blur(18px);opacity:.55;transform-origin:50% 0;mix-blend-mode:screen}
.beam.l{left:-40px;transform:rotate(-24deg);animation:sway 9s ease-in-out infinite alternate}
.beam.r{right:-40px;transform:rotate(24deg);animation:sway2 11s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(-14deg)}}
@keyframes sway2{to{transform:rotate(16deg)}}
.lamp{position:absolute;top:8px;width:46px;height:14px;border-radius:4px;background:var(--flood);box-shadow:0 0 22px 8px rgba(255,243,207,.6)}
.lamp.l{left:8px}.lamp.r{right:8px}
.htop{display:flex;align-items:center;gap:12px}
.htop img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(63,211,122,.35)}
.htop .t{font-weight:700;font-size:13px;line-height:1.2}
.htop .s{font-size:12px;color:var(--muted)}
.title{font-size:clamp(64px,19vw,112px);margin-top:26px;text-shadow:0 6px 40px rgba(63,211,122,.35)}
.title span{display:block;color:var(--esc)}
.title .ln{display:block;animation:rise .7s var(--ease-out) both}
.title .ln:nth-child(2){animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(4px)}}

/* Próximo partido + cuenta atrás */
.next{margin-top:22px;background:rgba(6,17,13,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px;display:grid;gap:12px;text-align:left;width:100%;animation:rise .7s .2s var(--ease-out) both}
.mdc{margin-top:22px;position:relative;overflow:hidden;border-radius:18px;touch-action:pan-y;animation:rise .7s .2s var(--ease-out) both}
.mdc .trk{display:flex;transition:transform .65s var(--ease-io);will-change:transform}
.mdc .next{flex:0 0 100%;margin-top:0;animation:none}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots button{width:8px;height:8px;border-radius:99px;background:rgba(228,244,234,.3);transition:width .3s var(--ease-out),background-color .2s ease}
.dots button[aria-current="true"]{width:24px;background:var(--esc)}
.ticker{position:relative;display:flex;align-items:center;background:#020806;border-bottom:1px solid var(--line);overflow:hidden}
.ticker .lb{flex:none;position:relative;z-index:2;align-self:stretch;display:flex;align-items:center;gap:6px;padding:8px 12px 8px max(12px,env(safe-area-inset-left,0px));background:var(--esc);color:var(--esc-ink);font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.ticker .lb::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--esc-ink);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.ticker .vp{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tk{display:flex;width:max-content;animation:tick var(--dur,60s) linear infinite}
.ticker:hover .tk,.ticker:focus-within .tk{animation-play-state:paused}
.tk span{white-space:nowrap;font-size:13px;padding:9px 0;display:flex;align-items:center}
.tk span::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);margin:0 18px}
.tk b{color:var(--esc);font-weight:700;margin-right:6px}.tk em{font-style:normal;color:var(--gold);font-weight:700;margin-right:6px}
@keyframes tick{to{transform:translateX(-50%)}}
.cw{position:relative;flex:0 0 auto;scroll-snap-align:center}
.heart{position:absolute;top:8px;right:8px;z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(2,8,6,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--chalk);transition:transform 160ms var(--ease-out)}
.heart:active{transform:scale(.9)}
.heart[aria-pressed="true"]{color:#ff6b81}
.heart[aria-pressed="true"] svg{animation:beat .4s var(--ease-out)}
@keyframes beat{40%{transform:scale(1.3)}}
.mini .cw .card{height:100%}
.mt{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mt .lbl{font-family:var(--display);font-weight:900;font-size:40px;line-height:.9;text-transform:uppercase;color:var(--chalk)}
.mt .cat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--esc-ink);background:var(--esc);border-radius:999px;padding:4px 10px;white-space:nowrap}
.vsg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.vsg .sd2{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.vsg .sd2 b{font-size:12.5px;line-height:1.2;text-transform:uppercase;font-weight:700;overflow-wrap:anywhere}
.vsg .sd2.me b{color:var(--esc)}
.vsg .x{font-family:var(--display);font-weight:900;font-size:26px;color:var(--muted)}
.when{text-align:center;font-size:14px;line-height:1.35}
.when b{display:block;font-family:var(--display);font-weight:800;font-size:22px;color:var(--chalk);letter-spacing:.02em;text-transform:uppercase}
.when strong{display:block;font-family:var(--display);font-weight:900;font-size:40px;line-height:1;color:var(--flood);text-shadow:0 0 16px rgba(255,243,207,.4);margin-block:2px 4px}
.when span{color:var(--muted);font-size:12.5px}
.next .row{display:flex;align-items:center;gap:12px}
.next .vs{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;text-transform:uppercase;min-width:0}
.next .vs small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted);text-transform:none;margin-top:4px}
.count{display:flex;gap:8px}
.cell{flex:1;background:#020806;border:1px solid var(--line);border-radius:10px;padding:8px 6px 6px;text-align:center}
.cell b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--flood);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,243,207,.45)}
.cell span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.roll{display:inline-block;animation:roll .45s var(--ease-out)}
@keyframes roll{from{transform:translateY(-60%);opacity:0}}

/* ---------- Fichas 3D y fondo vivo ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
.fichas{perspective:1100px;perspective-origin:50% 30%;display:grid;gap:30px;padding-block:30px 10px}
.ficha{--gl:0;position:relative;min-width:0;border-radius:26px;padding:22px 16px 20px;transform-origin:50% 0%;will-change:transform;
  background:linear-gradient(160deg,rgba(24,56,41,.62),rgba(7,20,14,.7) 70%);border:1px solid rgba(228,244,234,.13);
  box-shadow:0 40px 70px -34px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ficha::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--gl);
  background:linear-gradient(180deg,rgba(255,243,207,.16),transparent 40%)}
.ficha::after{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(63,211,122,.9),transparent)}
.ftag{position:absolute;top:-13px;left:18px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--esc-ink);background:var(--esc);padding:5px 11px;border-radius:999px;box-shadow:0 6px 16px -6px rgba(63,211,122,.7)}
.ftag.gold{background:var(--gold);color:#1d1400;box-shadow:0 6px 16px -6px rgba(242,193,78,.7)}
.fh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:6px}
.fh h2{margin:0;font-size:34px}
.fsub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.ficha .deck{margin-inline:-16px;padding-inline:16px}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.club{padding:22px 12px 14px;isolation:isolate;transform:none!important;opacity:1!important}
.club::before{opacity:1;inset:-1px;padding:1.5px;border-radius:27px;
  background:conic-gradient(from var(--a),transparent 0 72%,rgba(63,211,122,.15) 80%,#3fd37a 88%,#d9ffe8 90%,#3fd37a 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  filter:drop-shadow(0 0 6px rgba(63,211,122,.9));animation:spin 6s linear infinite}
@keyframes spin{to{--a:360deg}}
.club>.fh{padding-inline:4px}
.blk{position:relative;border-radius:20px;padding:16px 12px 14px;margin-top:14px;transform-origin:50% 0%;will-change:transform;
  background:linear-gradient(160deg,rgba(28,64,47,.55),rgba(5,16,11,.6));border:1px solid rgba(228,244,234,.1);box-shadow:0 22px 40px -26px rgba(0,0,0,.9)}
.blk .fh h2{font-size:26px}
.blk .ftag{top:-11px;left:14px;font-size:9.5px;padding:4px 9px}
.ficha .search input{background:rgba(2,8,6,.6)}

/* ---------- Botas de oro, plata y bronce ---------- */
.boots{position:relative;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:6px;padding-top:30px;margin-top:4px;isolation:isolate}
.boots::before{content:"";position:absolute;left:50%;top:-30px;width:220px;height:300px;margin-left:-110px;z-index:-1;pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,243,207,.22) 18deg,rgba(255,243,207,.05) 30deg,transparent 40deg);filter:blur(6px)}
.bt{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center}
.stage3d{perspective:520px;width:100%;height:96px;display:grid;place-items:center;position:relative}
.bt.g .stage3d{height:122px}
.boot{position:relative;width:118px;height:66px;transform-style:preserve-3d;animation:turn 7s var(--ease-io) infinite alternate;will-change:transform}
.bt.g .boot{width:150px;height:84px;animation-duration:6s}
.bt.b .boot{animation-delay:-2.5s}.bt.s .boot{animation-delay:-4s}
.boot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.boot.glv{width:74px;height:80px}.bt.g .boot.glv{width:92px;height:100px}
.boot .ly{transform:translateZ(calc(var(--z) * -1px))}
@keyframes turn{0%{transform:rotateY(-32deg) rotateX(8deg) translateY(2px)}50%{transform:rotateY(4deg) rotateX(4deg) translateY(-6px)}100%{transform:rotateY(30deg) rotateX(9deg) translateY(1px)}}
.shadow{position:absolute;bottom:4px;left:50%;width:70%;height:12px;margin-left:-35%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);animation:shad 7s var(--ease-io) infinite alternate}
@keyframes shad{50%{transform:scaleX(.8);opacity:.6}}
.spark{position:absolute;width:6px;height:6px;pointer-events:none;background:radial-gradient(circle,#fff 0 30%,transparent 70%);animation:spark 2.6s ease-in-out infinite}
.spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;margin:-.75px 0 0 -7px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.spark::after{transform:rotate(90deg)}
@keyframes spark{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
.ped{width:100%;border-radius:14px 14px 6px 6px;padding:10px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),linear-gradient(180deg,var(--pc1),var(--pc2));border:1px solid var(--pcb);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 30px -20px #000}
.bt.g .ped{--pc1:#3a3112;--pc2:#141006;--pcb:rgba(242,193,78,.5);min-height:200px}
.bt.s .ped{--pc1:#2b3136;--pc2:#0e1113;--pcb:rgba(207,214,220,.45);min-height:170px}
.bt.b .ped{--pc1:#33220f;--pc2:#120b05;--pcb:rgba(205,127,50,.5);min-height:150px}
.ped .rk{font-family:var(--display);font-weight:900;font-size:12px;letter-spacing:.06em;line-height:1.05;text-transform:uppercase}
.bt.g .rk{color:#f2c14e}.bt.s .rk{color:#d9e0e5}.bt.b .rk{color:#e0965a}
.ped .gl{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;color:var(--flood)}
.bt.g .ped .gl{font-size:44px}
.ped .gl small{font-size:13px;color:var(--muted);font-weight:800;margin-left:2px}
.ped .pn{font-weight:700;font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.ped .pt{font-size:10.5px;color:var(--muted);line-height:1.25}
.boots.gv .ped .gl{font-size:30px}.boots.gv .bt.g .ped .gl{font-size:38px}.boots.gv .ped .gl small{display:block;font-size:10px;margin:2px 0 0;letter-spacing:.06em;text-transform:uppercase}
.bnote{font-size:12px;color:var(--muted);margin-top:12px}

/* ---------- Tablón de honor ---------- */
.tro{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tr2{position:relative;overflow:hidden;border-radius:18px;padding:12px 12px 14px;min-width:0;
  background:radial-gradient(90% 70% at 50% 0%,rgba(242,193,78,.28),transparent 70%),linear-gradient(165deg,#2a2412,#0b0a05);border:1px solid rgba(242,193,78,.35)}
.tr2.z{background:radial-gradient(90% 70% at 50% 0%,rgba(94,200,255,.25),transparent 70%),linear-gradient(165deg,#10222c,#05090c);border-color:rgba(94,200,255,.35)}
.tr2::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 58%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
.tr2.z::after{animation-delay:2.2s}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.tr2 .ico{width:46px;height:46px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tr2 .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold);margin-top:6px}
.tr2.z .k{color:#8fd8ff}
.tr2 .w{font-family:var(--display);font-weight:900;font-size:21px;line-height:1;text-transform:uppercase;margin-top:4px;overflow-wrap:anywhere}
.tr2 .s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.tr2 .big{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--flood);position:absolute;top:12px;right:12px}
.hsw{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(2,8,6,.6);border-radius:999px;padding:4px;margin-bottom:12px}
.hsw button{position:relative;z-index:1;padding:8px;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s ease}
.hsw button[aria-pressed="true"]{color:#1d1400}
.hsw .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--gold);transition:transform .32s var(--ease-out),background-color .32s ease}
.hsw.z .pill{transform:translateX(100%);background:#8fd8ff}
.hl{display:grid;gap:8px}
.hr2{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:rgba(2,8,6,.5);border-radius:14px;padding:10px 12px}
.hr2 .tm{font-family:var(--display);font-weight:900;font-size:16px;line-height:1;text-transform:uppercase;width:84px}
.hr2 .tm small{display:block;font-family:var(--body);font-size:10.5px;font-weight:600;color:var(--muted);text-transform:none;margin-top:3px}
.hr2 .who{min-width:0;font-size:13.5px;line-height:1.25}
.hr2 .who span{display:block;font-size:11.5px;color:var(--muted)}
.hr2 .val{font-family:var(--display);font-weight:900;font-size:24px;color:var(--gold);text-align:right;line-height:1}
.hr2 .val small{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hl.z .val{color:#8fd8ff}
.hr2.first{box-shadow:inset 0 0 0 1px rgba(242,193,78,.55)}
.hl.z .hr2.first{box-shadow:inset 0 0 0 1px rgba(143,216,255,.55)}

/* ---------- Cromos ---------- */
.sec{padding-block:26px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{margin:0;font-size:30px}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0 26px;scrollbar-width:none;perspective:900px;
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.deck::-webkit-scrollbar{display:none}

/* Carrusel: avanza solo y rebota (izquierda→derecha y vuelta); se puede deslizar en los dos sentidos */
let carT=null,carI=0,carDir=1;
function carousel(n){
  const trk=document.getElementById("trk"),mdc=document.getElementById("mdc");if(!trk||n<2)return;
  carI=0;carDir=1;
  const go=i=>{carI=Math.max(0,Math.min(n-1,i));trk.style.transform=`translateX(${-carI*100}%)`;
    document.querySelectorAll("#dots button").forEach((b,k)=>b.setAttribute("aria-current",k===carI))};
  const auto=()=>{clearInterval(carT);if(RM)return;carT=setInterval(()=>{if(!document.body.contains(trk)){clearInterval(carT);return}
    if(carI+carDir>n-1||carI+carDir<0)carDir=-carDir;go(carI+carDir)},5200)};
  document.getElementById("dots").addEventListener("click",e=>{const b=e.target.closest("[data-slide]");if(b){go(+b.dataset.slide);auto()}});
  let sx=null,st=0,moved=false;
  mdc.addEventListener("pointerdown",e=>{sx=e.clientX;st=Date.now();moved=false;clearInterval(carT);trk.style.transition="none"});
  mdc.addEventListener("pointermove",e=>{if(sx==null)return;const dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;
    let off=dx;if((carI===0&&dx>0)||(carI===n-1&&dx<0))off=dx*.3;trk.style.transform=`translateX(calc(${-carI*100}% + ${off}px))`});
  const end=e=>{if(sx==null)return;const dx=(e.clientX||sx)-sx,v=Math.abs(dx)/(Date.now()-st);sx=null;trk.style.transition="";
    if(Math.abs(dx)>mdc.offsetWidth*.25||v>.4){carDir=dx<0?1:-1;go(carI+(dx<0?1:-1))}else go(carI);auto()};
  mdc.addEventListener("pointerup",end);mdc.addEventListener("pointercancel",end);mdc.addEventListener("pointerleave",e=>{if(sx!=null)end(e)});
  mdc.addEventListener("click",e=>{if(moved){e.preventDefault();moved=false}},true);
  auto();
}
let cdTimer=null;
function startCount(){
  clearInterval(cdTimer);
  const els=[...document.querySelectorAll(".count[data-dt]")];if(!els.length)return;
  const tick=()=>{if(!els[0].isConnected){clearInterval(cdTimer);return}
    els.forEach(el=>{const dt=+el.dataset.dt;const prev=el._p||{};let s=Math.max(0,(dt-Date.now())/1000);const v={d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60)};
      el.innerHTML=[["d","días"],["h","horas"],["m","min"]].map(([k,l])=>`<div class="cell"><b>${prev[k]!==v[k]?`<span class="roll">${String(v[k]).padStart(2,"0")}</span>`:String(v[k]).padStart(2,"0")}</b><span>${l}</span></div>`).join("");el._p=v})};
  tick();cdTimer=setInterval(tick,15000);
}
/* Coverflow: los cromos giran según su distancia al centro (funciona con el dedo) */
function coverflow(){
  const deck=document.getElementById("deck");if(!deck)return;
  const cards=[...deck.querySelectorAll(".card")];let raf=0;
  const upd=()=>{raf=0;const r=deck.getBoundingClientRect();const cx=r.left+r.width/2;
    cards.forEach(cd=>{const b=cd.getBoundingClientRect();let d=(b.left+b.width/2-cx)/(r.width/2);d=Math.max(-1.2,Math.min(1.2,d));
      cd.style.transform=RM?"":`rotateY(${(-d*22).toFixed(2)}deg) scale(${(1-Math.abs(d)*.08).toFixed(3)})`;
      cd.style.setProperty("--h",`${(d*140).toFixed(0)}deg`);cd.style.setProperty("--g",(.18+Math.abs(d)*.35).toFixed(2));
      cd.style.setProperty("--sx",`${(-40+d*-90).toFixed(0)}%`)})};
  deck.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(upd)},{passive:true});
  upd();
  /* en ordenador: inclinación con el ratón, suavizada */
  if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!RM)cards.forEach(cd=>{
    let tx=0,ty=0,x=0,y=0,on=false,id=0;
    const loop=()=>{x+=(tx-x)*.12;y+=(ty-y)*.12;cd.style.transform=`rotateX(${y.toFixed(2)}deg) rotateY(${x.toFixed(2)}deg) scale(1.02)`;cd.style.setProperty("--h",`${(x*8).toFixed(0)}deg`);
      if(on||Math.abs(tx-x)>.05||Math.abs(ty-y)>.05)id=requestAnimationFrame(loop);else upd()};
    cd.addEventListener("pointermove",e=>{const b=cd.getBoundingClientRect();tx=((e.clientX-b.left)/b.width-.5)*18;ty=-((e.clientY-b.top)/b.height-.5)*18;if(!on){on=true;cancelAnimationFrame(id);loop()}});
    cd.addEventListener("pointerleave",()=>{on=false;tx=0;ty=0});
  });
}
function norm(x){return String(x).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}
function tc(x){const low=["de","del","la","las","los","y"];return String(x).toLowerCase().split(/(\s+|-)/).map((w,i)=>low.includes(w)&&i>0?w:w.charAt(0).toUpperCase()+w.slice(1)).join("")}
function search(q){
  q=(q||"").trim();const out=document.getElementById("res");if(q.length<2){out.innerHTML="";return}
  const toks=norm(q).split(/\s+/);const r=[];
  CATALOG.forEach(e=>((DATA[e.k]&&DATA[e.k].squad)||ROSTERS[e.k]||[]).forEach(p=>{if(toks.every(t=>norm(p).includes(t)))r.push([p,e])}));
  out.innerHTML=r.length?r.slice(0,20).map(([p,e])=>`<a class="press" href="#${e.k}">${esc(tc(p))}<span>${esc(e.label)}</span></a>`).join(""):`<div class="note">No hay ningún jugador con ese nombre. Prueba con el primer apellido.</div>`;
}

/* ---------- Fichas que se despliegan en 3D al hacer scroll ---------- */
let fRaf=0;
function fichas3d(){
  const els=[...document.querySelectorAll("[data-f]")];
  const upd=()=>{fRaf=0;const vh=innerHeight;
    els.forEach(el=>{const r=el.getBoundingClientRect();
      if(r.bottom<-50||r.top>vh+50)return;
      let e=(r.top-vh*.62)/(vh*.38);e=Math.max(0,Math.min(1,e));           /* entrando por abajo */
      let x=(-r.top)/(vh*.9);x=Math.max(0,Math.min(1,x));                   /* saliendo por arriba */
      const rx=e*34-x*8, ty=e*70, sc=1-e*.08-x*.05, tz=-e*120;
      el.style.transform=RM?"":`translate3d(0,${ty.toFixed(1)}px,${tz.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      el.style.opacity=RM?"":(1-e*.55).toFixed(3);
      el.style.setProperty("--gl",(e*.9+x*.4).toFixed(2))})};
  window.removeEventListener("scroll",fichas3d._h);
  fichas3d._h=()=>{if(!fRaf)fRaf=requestAnimationFrame(upd)};
  window.addEventListener("scroll",fichas3d._h,{passive:true});
  upd();
}
window.addEventListener("resize",()=>{if(fichas3d._h)fichas3d._h()});

/* ---------- Fondo vivo: campo en paralaje, polvo de los focos y un balón que rueda al bajar ---------- */
(function(){
  const cv=document.getElementById("bg"),ctx=cv.getContext("2d");let W=0,H=0,D=1;
  const size=()=>{D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)};
  size();addEventListener("resize",size);
  const motes=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,s:.15+Math.random()*.5,a:.05+Math.random()*.18,p:Math.random()*6.28}));
  const ball={x:innerWidth*.5,y:innerHeight*.74,vx:0,vy:0,rot:0,R:24};const trail=[];
  let sy=scrollY,last=performance.now();
  function pent(cx,cy,r,a){ctx.beginPath();for(let i=0;i<5;i++){const t=a+i*Math.PI*2/5-Math.PI/2;ctx.lineTo(cx+Math.cos(t)*r,cy+Math.sin(t)*r)}ctx.closePath();ctx.fill()}
  function drawBall(x,y,R,rot,al){
    ctx.save();ctx.globalAlpha=al*.5;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x,y+R*1.05,R*.95,R*.22,0,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.globalAlpha=al;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.clip();
    const g=ctx.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#b9c9bf");ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);
    ctx.fillStyle="#0b1d15";ctx.translate(x,y);ctx.rotate(rot);pent(0,0,R*.36,0);
    for(let i=0;i<5;i++){const t=i*Math.PI*2/5-Math.PI/2;pent(Math.cos(t)*R*.92,Math.sin(t)*R*.92,R*.3,Math.PI/5+t)}
    ctx.strokeStyle="rgba(11,29,21,.55)";ctx.lineWidth=1.2;for(let i=0;i<5;i++){const t=i*Math.PI*2/5-Math.PI/2;ctx.beginPath();ctx.moveTo(Math.cos(t)*R*.36,Math.sin(t)*R*.36);ctx.lineTo(Math.cos(t)*R*.7,Math.sin(t)*R*.7);ctx.stroke()}
    ctx.restore();
    ctx.save();ctx.globalAlpha=al;ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,R-.5,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  function pitch(off){
    ctx.save();ctx.strokeStyle="rgba(228,244,234,.055)";ctx.lineWidth=2;const P=1100,m=22,w=W-m*2;
    for(let k=-1;k<3;k++){const y0=k*P-(off%P);
      ctx.strokeRect(m,y0,w,P);ctx.beginPath();ctx.moveTo(m,y0+P/2);ctx.lineTo(m+w,y0+P/2);ctx.stroke();
      ctx.beginPath();ctx.arc(W/2,y0+P/2,Math.min(90,w*.22),0,Math.PI*2);ctx.stroke();
      ctx.strokeRect(W/2-w*.3,y0,w*.6,150);ctx.strokeRect(W/2-w*.14,y0,w*.28,55);
      ctx.strokeRect(W/2-w*.3,y0+P-150,w*.6,150);ctx.strokeRect(W/2-w*.14,y0+P-55,w*.28,55);}

  }
  /* Hilo verde con luces que lo recorren */
  function tx_(y,off){return W/2+Math.sin((y+off)/170)*W*.40+Math.sin((y+off)/61)*14}
  function thread(now){
    const off=sy*.55;ctx.save();ctx.lineCap="round";
    ctx.strokeStyle="rgba(63,211,122,.10)";ctx.lineWidth=1.5;ctx.beginPath();
    for(let y=-10;y<=H+10;y+=8)ctx.lineTo(tx_(y,off),y);ctx.stroke();
    for(const ph of [0,.5]){
      const p=((now/5200+ph)%1)*(H+300)-150;
      ctx.shadowColor="#3fd37a";ctx.shadowBlur=14;
      for(let k=0;k<26;k++){const y=p-k*7;if(y<-10||y>H+10)continue;const a=(1-k/26);
        ctx.strokeStyle=`rgba(${k<3?"220,255,232":"63,211,122"},${(a*.85).toFixed(3)})`;ctx.lineWidth=k<3?3:2.4*a+.6;
        ctx.beginPath();ctx.moveTo(tx_(y,off),y);ctx.lineTo(tx_(y-7,off),y-7);ctx.stroke()}

  }
  /* Grada de hinchas a contraluz: bufandas, pancarta y bombo */
  const fans=Array.from({length:90},(_,i)=>({x:Math.random(),row:i%3,ph:Math.random()*6.28,sc:Math.random()<.28,arm:Math.random()<.2,s:.85+Math.random()*.3}));
  fans.sort((a,b)=>a.row-b.row);

  function makeBanner(){ban.width=520;ban.height=64;bctx.fillStyle="#1f7a45";bctx.fillRect(0,0,520,64);bctx.fillStyle="#f3f4f2";for(let i=0;i<520;i+=40)bctx.fillRect(i,0,20,6),bctx.fillRect(i+20,58,20,6);
    bctx.font="900 40px 'Big Shoulders Display', Impact, sans-serif";bctx.textAlign="center";bctx.textBaseline="middle";bctx.fillText("VAMOS ESCOLAPIOS",260,34)}
  makeBanner();if(document.fonts)document.fonts.ready.then(makeBanner);
  function crowd(now){
    const base=H, beat=(now%1400)/1400, kick=Math.max(Math.exp(-beat*9),.0+Math.exp(-Math.abs(beat-.22)*40)*.8);
    ctx.save();
