
<title>Escolapios Fútbol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap">
<style>
/* Layout: app de una columna (máx. 560px) que imita la app oficial de la RFFM: cabecera fija, pestañas horizontales, tiras de jornadas deslizables */
:root{
  --bg:#13303b; --panel:#1a3d4a; --panel2:#21495a; --line:#2c5a6b;
  --fg:#eef5f4; --muted:#9fbcc1; --accent:#5fc48a; --accent-ink:#0e2a22;
  --warn:#f2a86b; --bad:#e8573e; --pitch:#2a6870;
  --display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;min-height:100%}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Selector */
.home{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.home h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.home p{margin:0;color:var(--muted)}
.pick{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;width:100%}
.pick:hover{background:var(--panel2)}
.pick svg{flex:none}
.pick .cat{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pick .nm{font-weight:800;font-size:19px;line-height:1.2}
.pick .grp{color:var(--muted);font-size:13px}
.pick .nx{margin-top:6px;font-size:13px}
.pick .nx b{color:var(--accent);font-weight:600}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0f2832;padding-block:10px 0}
.hrow{display:flex;align-items:center;gap:12px}
.back{width:36px;height:36px;display:grid;place-items:center;font-size:22px;flex:none}
.htxt{min-width:0;flex:1;text-align:center;padding-right:42px}
.hlogo{width:30px;height:30px;flex:none;border-radius:50%}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:50px;height:50px;flex:none;border-radius:50%;background:#fff}
.htxt .t{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htxt .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-top:8px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar,.strip::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--accent)}

/* Tira de jornadas */
.strip{display:flex;overflow-x:auto;scrollbar-width:none;background:#163542;border-bottom:1px solid var(--line);scroll-behavior:smooth}
.jb{flex:none;padding:12px 16px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.jb[aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--accent)}
.jb .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}

main{padding-block:16px 40px}

/* Partido destacado */
.match{background:radial-gradient(120% 80% at 50% 0%,var(--pitch),var(--panel) 70%);border-radius:18px;padding:22px 12px 18px;position:relative;overflow:hidden}
.match::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.08)}
.mgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;position:relative;z-index:1}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0}
.side .tn{font-weight:700;font-size:13px;line-height:1.25;text-transform:uppercase}
.side.me .tn{color:var(--accent)}
.score{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:18px}
.sbox{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:34px;line-height:1;padding:12px 14px;border-radius:12px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.sbox.pre{background:#0f2832;color:var(--fg);font-size:22px;border:1px solid var(--line)}
.stag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(95,196,138,.15);color:var(--accent)}
.stag.w{background:rgba(95,196,138,.18);color:var(--accent)}
.stag.l{background:rgba(232,87,62,.18);color:#ff9a86}
.stag.d{background:rgba(242,168,107,.18);color:var(--warn)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;position:relative;z-index:1}
.rest{background:var(--panel);border-radius:18px;padding:30px 20px;text-align:center}
.rest b{display:block;font-size:20px;margin-bottom:6px}

.info{margin-top:16px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.info h3{margin:0;background:var(--fg);color:#13303b;text-align:center;font-size:14px;letter-spacing:.06em;padding:8px;font-weight:800}
.irow{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--panel)}
.irow:nth-child(odd){background:var(--panel2)}
.irow .ic{width:22px;flex:none;color:var(--accent)}
.irow .tx{min-width:0}
.irow .lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.goals li{display:flex;gap:8px;font-size:14px}
.goals .min{color:var(--muted);font-variant-numeric:tabular-nums;width:30px;flex:none}
.goals .me{color:var(--accent);font-weight:600}

/* Resultados */
.day{background:var(--fg);color:#13303b;text-align:center;font-weight:700;font-size:14px;padding:8px;border-radius:12px 12px 0 0;letter-spacing:.02em}
.list{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.rrow{display:grid;grid-template-columns:1fr 92px 1fr;gap:6px;align-items:center;padding:14px 8px;border-top:1px solid var(--line);background:var(--panel)}
.rrow:first-child{border-top:0}
.rrow.mine{background:#1f4f45}
.rt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.rt span{font-size:11.5px;font-weight:700;line-height:1.2;text-transform:uppercase;overflow-wrap:anywhere}
.rmid{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.rmid .sc{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.rmid .hr{font-weight:600;font-size:14px}
.rmid .dt{font-size:11px;color:var(--muted)}
.rmid .vn{font-size:10px;color:var(--muted);line-height:1.2}
.restline{padding:12px 16px;background:var(--panel2);font-size:13px;color:var(--muted);border-top:1px solid var(--line)}

/* Clasificación */
.sub{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}
.sub button{flex:1;padding:10px;color:var(--muted);border-bottom:3px solid transparent}
.sub button[aria-selected="true"]{color:var(--fg);font-weight:700;border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
.tbl th{background:var(--fg);color:#13303b;font-weight:600;padding:9px 6px;text-align:center;font-size:12.5px}
.tbl th:nth-child(2){text-align:left}
.tbl td{padding:12px 6px;border-top:1px solid var(--line);text-align:center;background:var(--panel)}
.tbl tr:nth-child(even) td{background:var(--panel2)}
.tbl td.tm{text-align:left;max-width:0;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td.ps{font-weight:700;width:34px;position:relative}
.tbl td.pts{font-weight:800}
.tbl tr.me td{background:#1f4f45!important;color:#fff}
.tbl tr.me td.tm{font-weight:700}
.zone{position:absolute;left:0;top:0;bottom:0;width:5px}
.scroll{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.crow{border-top:1px solid var(--line);background:var(--panel)}
.crow:nth-child(even){background:var(--panel2)}
.crow.me{background:#1f4f45}
.chead{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px 13px 18px;text-align:left;position:relative}
.chead .p{font-weight:700;width:26px;flex:none;font-variant-numeric:tabular-nums}
.chead .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .chev{color:var(--accent);transition:transform .2s}
.chead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.chead .pt{font-weight:800;width:28px;text-align:right;font-variant-numeric:tabular-nums}
.cdet{padding:0 14px 14px 54px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
.form{display:flex;gap:6px}
.form i{font-style:normal;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.form .W{background:var(--accent);color:var(--accent-ink)}
.form .D{background:var(--warn);color:#3a2200}
.form .L{background:var(--bad);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* Goleadores */
.filters{display:flex;gap:8px;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.grow{display:grid;grid-template-columns:34px 40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.grow:nth-child(even){background:var(--panel2)}
.grow.me{background:#1f4f45}
.grow .pos{font-weight:800;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.av{width:40px;height:40px;border-radius:50%;background:#cfd8dc;display:grid;place-items:center;overflow:hidden}
.grow .pl{min-width:0}
.grow .pl b{display:block;font-size:13.5px;text-transform:uppercase;line-height:1.25}
.grow .pl span{color:var(--accent);font-size:12.5px}
.grow .gl{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grow .gl small{font-weight:600;font-size:13px;color:var(--muted)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:6px;font-size:16px}

/* Plantilla */
.sec{background:var(--fg);color:#13303b;text-align:center;font-weight:800;font-size:14px;letter-spacing:.06em;padding:8px;border-radius:12px 12px 0 0}
.prow{display:flex;gap:14px;align-items:center;padding:11px 16px;background:var(--panel);border-top:1px solid var(--line)}
.prow:nth-child(even){background:var(--panel2)}
.plist{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden;margin-bottom:16px}
.prow .nm{text-transform:uppercase;font-size:14px}
.prow .gtag{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.search{display:flex;flex-direction:column;gap:8px}
.search input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.slist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.slist .lrow:first-child{border-top:0}
.sempty{font-size:13px;color:var(--muted);padding:4px 2px}
.upd{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.updmsg{margin:0;font-size:13px;color:var(--fg);text-align:center;max-width:40ch}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,16,21,.72);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.mh{display:flex;justify-content:center}
.mbox h2{margin:0;font-size:18px;line-height:1.3;text-wrap:balance}
.mbox p{margin:0;color:var(--muted);font-size:14px}
.mbtns{display:flex;gap:10px;margin-top:8px}
.mb{flex:1;padding:12px;border-radius:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.mb.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.pickwrap{position:relative}
.pickwrap .pick{padding-right:56px}
.pickheart{position:absolute;top:6px;right:4px}
/* Favoritos y lista de equipos */
.favs{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
details.all{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
details.all summary{list-style:none;display:flex;align-items:center;gap:10px;padding:16px;font-weight:700;cursor:pointer}
details.all summary::-webkit-details-marker{display:none}
details.all summary::after{content:"⌄";margin-left:auto;color:var(--accent);font-size:20px;line-height:1;transition:transform .2s}
details.all[open] summary::after{transform:rotate(180deg)}
details.all .cnt{font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);border-radius:999px;padding:2px 9px}
.lg{padding:10px 16px 6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;background:#163542;border-top:1px solid var(--line)}
.lrow{display:flex;align-items:center;border-top:1px solid var(--line)}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px 16px;color:inherit;text-decoration:none}
.lmain:hover{background:var(--panel2)}
.ln{font-weight:600;font-size:15px}
.lc{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heart{width:52px;height:52px;display:grid;place-items:center;flex:none;color:var(--muted)}
.heart[aria-pressed="true"]{color:#ff6b81}
/* Próximos */
.nrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.nrow:first-child{border-top:0}
.nrow:nth-child(even){background:var(--panel2)}
button.nrow:hover{background:#2a5668}
.nd{display:flex;flex-direction:column;width:78px;flex:none;font-variant-numeric:tabular-nums}
.nd b{font-size:13px;color:var(--accent)}
.nd span{font-size:13px}
.nd .tm{font-weight:700;font-size:15px}
.nd .tm.pend{font-weight:500;font-size:12px;color:var(--warn)}
.nb{display:flex;flex-direction:column;min-width:0;gap:2px}
.nt{font-weight:600;font-size:14px;line-height:1.25}
.nv{font-size:12px;color:var(--muted);line-height:1.25}
.nchg{align-self:flex-start;font-size:11px;font-weight:700;color:#3a2200;background:var(--warn);border-radius:999px;padding:1px 8px;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap" id="app"></div>

/* ---------- Preparación ---------- */
function build(c){
  c.J=[];
  for(let n=1;n<=c.dates.length;n++){
    let ms;
    if(c.m[n]) ms=c.m[n].map(a=>({h:a[0],a:a[1],hg:a[2],ag:a[3],d:a[4],t:a[5],v:a[6]||c.defaultVenue||""}));
    else ms=c.pairs[n].split(" ").map(p=>{const[h,a]=p.split("-");return{h,a,hg:null,ag:null,d:c.dates[n-1],t:null,v:null}});
    let rest=c.rest[n]||null;
    c.J.push({n,date:c.dates[n-1],ms,rest});
  }
  // jornada actual: la primera con partidos sin jugar cuya fecha >= hoy
  c.cur=c.J.findIndex(j=>toDate(c,j.date)>=TODAY)+1||c.J.length;
}
function toDate(c,dm){const[d,m]=dm.split("/");return new Date(c.year[m],+m-1,+d)}
const MES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIA=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
function longDate(c,dm){const dt=toDate(c,dm);return `${dt.getDate()} ${MES[dt.getMonth()]} - ${DIA[dt.getDay()]}`}
function dayHeader(c,dm){const dt=toDate(c,dm);return `${DIA[dt.getDay()].toUpperCase()} ${String(dt.getDate()).padStart(2,"0")} DE ${MES[dt.getMonth()].toUpperCase()}`}
function nm(c,code){const t=c.teams[code];return t.n}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}

function standings(c){
  const s={};Object.keys(c.teams).forEach(k=>s[k]={k,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0,form:[]});
  c.J.forEach(j=>j.ms.forEach(m=>{
    if(m.hg==null)return;
    const H=s[m.h],A=s[m.a];H.pj++;A.pj++;H.gf+=m.hg;H.gc+=m.ag;A.gf+=m.ag;A.gc+=m.hg;
    if(m.hg>m.ag){H.pg++;A.pp++;H.pts+=3;H.form.push("W");A.form.push("L")}
    else if(m.hg<m.ag){A.pg++;H.pp++;A.pts+=3;A.form.push("W");H.form.push("L")}
    else{H.pe++;A.pe++;H.pts++;A.pts++;H.form.push("D");A.form.push("D")}
  }));
  return Object.values(s).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||c.order.indexOf(x.k)-c.order.indexOf(y.k));
}

function norm(x){return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function tc(x){const low=["de","del","la","las","los","y"];return String(x).toLowerCase().split(/(\s+|-)/).map((w,i)=>low.includes(w)&&i>0?w:w.charAt(0).toUpperCase()+w.slice(1)).join("")}
function rosterOf(k){return (COMPS[k]&&COMPS[k].squad)||ROSTERS[k]||[]}
function searchResults(q){
  q=(q||"").trim();if(q.length<2)return "";
  const toks=norm(q).split(/\s+/).filter(Boolean);const out=[];
  CATALOG.forEach(e=>rosterOf(e.k).forEach(p=>{const n=norm(p);if(toks.every(t=>n.includes(t)))out.push([p,e])}));
  if(!out.length)return `<div class="sempty">No hay ningún jugador con ese nombre en los equipos del club. Prueba con el primer apellido.</div>`;
  const favs=FAV.list;
  return `<div class="slist">${out.slice(0,30).map(([p,e])=>{const on=favs.includes(e.k);return `<div class="lrow"><a href="#${e.k}" class="lmain"><span class="ln">${esc(tc(p))}</span><span class="lc">${esc(e.label)} · ${esc(e.comp)}</span></a><button class="heart" data-fav="${e.k}" aria-pressed="${on}" aria-label="${on?"Quitar de favoritos":"Añadir a favoritos"}: ${esc(e.label)}">${heart(on)}</button></div>`}).join("")}</div>${out.length>30?`<div class="sempty">Hay ${out.length} coincidencias; escribe también el nombre para afinar.</div>`:""}`;
}

async function forceUpdate(k){
  const msg=m=>{S.updMsg=m;render()};
  let last=0;try{last=+localStorage.getItem("esc-upd")||0}catch(e){}
  if(Date.now()-last<15*60*1000){msg("Ya hay una actualización en marcha. Tarda unos 10–15 minutos y la app se recarga sola al terminar.");return}
  msg("Pidiendo la actualización…");
  let mcp=null;try{mcp=window.claude&&window.claude.use?await claude.use("mcp"):null}catch(e){}
  if(!mcp){msg("Desde este dispositivo no se puede lanzar la actualización. Se hará sola en la próxima revisión (lunes a viernes por la mañana).");return}
  try{if(DB&&UID)await DB.doc("favs/"+UID).set({teams:FAV.list,updated:Date.now()})}catch(e){}
  try{
    await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:UPDATE_TASK,text:"Actualización pedida desde la app."+(k?" Prioriza cargar el equipo con clave "+k+".":"")+" Favoritos de quien la pide: "+FAV.list.join(", ")+"."});
    try{localStorage.setItem("esc-upd",String(Date.now()))}catch(e){}
    msg("Actualización en marcha. Tarda unos 10–15 minutos; la app se recargará sola con los datos nuevos.");
  }catch(e){
    const c=e&&e.code;
    msg(c==="not_granted"||c==="consent_denied"||c==="denied"?"Hace falta permitir el acceso para lanzar la actualización. Vuelve a pulsar el botón y acepta el permiso.":"No se ha podido lanzar la actualización"+(c?" ("+c+")":"")+". Se hará sola en la próxima revisión.");
  }
}
function inClaude(){return !!(window.claude&&window.claude.use)}
function updButton(k){if(!inClaude())return "";return `<div class="upd"><button class="chip" data-upd="${k||""}">↻ Actualizar datos ahora</button>${S.updMsg?`<p class="updmsg" role="status">${esc(S.updMsg)}</p>`:""}</div>`}

function pendingView(k){

  <p class="foot"><a href="https://www.rffm.es/fichaequipo/${e.id}" target="_blank" rel="noopener">Ver ficha del equipo en la RFFM</a></p></main>`;

function card(c){
  {
    const j=c.J.find(x=>x.n===c.cur);const m=j?j.ms.find(x=>x.h===c.me||x.a===c.me):null;
    let nx;
    if(!j)nx="Sin partidos publicados";
    else if(!m)nx=`Jornada ${j.n}: <b>descansa</b>`;
    else{const op=m.h===c.me?m.a:m.h;nx=`Próximo: <b>${dayShort(c,m.d)}${m.t?" · "+m.t:""}</b> vs ${esc(nm(c,op))}`}
    return `<a class="pick" href="#${c.key}" style="color:inherit;text-decoration:none">${shirt(c.teams[c.me],62)}<div style="min-width:0"><div class="cat">${c.cat}</div><div class="nm">${c.label}</div><div class="grp">${esc(c.comp)}</div><div class="nx">${nx}</div></div></a>`;
  }
}
function dayShort(c,dm){const dt=toDate(c,dm);return `${DIA[dt.getDay()].slice(0,3).toLowerCase()} ${dt.getDate()} ${MES[dt.getMonth()].slice(0,3).toLowerCase()}`}

function strip(c,key){
  return `<div class="strip pad" role="tablist" aria-label="Jornadas">${c.J.map(j=>`<button class="jb" data-j="${key}:${j.n}" aria-selected="${S[key]===j.n}">Jornada ${j.n}${j.n===c.cur?'<span class="dot" title="Jornada actual"></span>':""}</button>`).join("")}</div>`;
}

function outcome(c,m){
  if(m.hg==null)return null;
  const mine=m.h===c.me?m.hg:m.ag,their=m.h===c.me?m.ag:m.hg;
  return mine>their?["w","Victoria"]:mine<their?["l","Derrota"]:["d","Empate"];
}

function nextView(c){
  const ch=CHANGES.filter(x=>x.team===c.key);
  const banner=ch.length?`<div class="info" style="margin:0 0 16px;border-color:var(--warn)"><h3 style="background:var(--warn)">CAMBIOS RECIENTES</h3>${ch.map(x=>`<div class="irow"><div class="tx"><div class="lb">Jornada ${x.j} · detectado ${esc(x.when)}</div>${esc(x.txt)}</div></div>`).join("")}</div>`:"";
  const up=c.J.filter(j=>toDate(c,j.date)>=TODAY);
  const rows=up.map(j=>{
    const m=j.ms.find(x=>x.h===c.me||x.a===c.me);
    const chg=ch.some(x=>x.j===j.n);
    if(!m)return `<div class="nrow rest"><div class="nd"><b>J${j.n}</b><span>${dayShort(c,j.date)}</span></div><div class="nb"><span class="nt" style="color:var(--muted)">Descansa</span></div></div>`;
    const homeG=m.h===c.me,op=homeG?m.a:m.h;
    const venue=m.v||c.futureVenue;
    return `<button class="nrow" data-goj="${j.n}"><div class="nd"><b>J${j.n}</b><span>${dayShort(c,m.d)}</span><span class="tm ${m.t?"":"pend"}">${m.t?m.t+"h":"Hora pendiente"}</span></div>${shirt(c.teams[op],40)}<div class="nb"><span class="nt">${homeG?"vs":"en casa de"} ${esc(nm(c,op))}</span><span class="nv">${esc(venue)}</span>${chg?'<span class="nchg">Cambiado</span>':""}</div></button>`;
  }).join("");
  return `${banner}<div class="day">PRÓXIMOS PARTIDOS</div><div class="list">${rows||'<div class="restline">No quedan partidos en esta fase.</div>'}</div><p class="foot">La RFFM publica la hora y la sede jornada a jornada, normalmente la semana del partido. Última revisión: ${UPDATED}.</p>`;
}

function jornadaView(c){
  if(!c.J.length)return `<div class="empty"><b>Sin jornadas publicadas</b>${esc(c.scorersNote||"La RFFM aún no ha publicado partidos de este equipo.")}</div>`;
  const j=c.J[S.jj-1];
  const m=j.ms.find(x=>x.h===c.me||x.a===c.me);
  if(!m)return `<div class="rest"><b>Escolapios descansa</b>Jornada ${j.n} · ${longDate(c,j.date)}</div>`;
  const played=m.hg!=null;const oc=outcome(c,m);
  const side=code=>`<div class="side ${code===c.me?"me":""}">${shirt(c.teams[code],118)}<div class="tn">${esc(nm(c,code))}</div></div>`;
  const center=played?`<div class="sbox">${m.hg}-${m.ag}</div><span class="stag ${oc[0]}">${oc[1]}</span>`:`<div class="sbox pre">${m.t||"--:--"}</div><span class="stag">Previa</span>`;
  const a=c.acta[j.n]||{};
  const ic={cal:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',pin:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',wh:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="14" r="5"/><path d="M12 10l9-4v5l-7 2"/></svg>',ball:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>'};
  let rows=`<div class="irow"><span class="ic">${ic.cal}</span><div class="tx">${longDate(c,m.d)} ${m.t?m.t+"h":"· horario pendiente"}</div></div>`;
  rows+=`<div class="irow"><span class="ic">${ic.pin}</span><div class="tx">${esc(m.v||c.futureVenue)}</div></div>`;
  rows+=`<div class="irow"><span class="ic">${ic.wh}</span><div class="tx">${a.ref?esc(a.ref):'<span style="color:var(--muted)">Árbitro sin designar</span>'}</div></div>`;
  if(played&&a.g&&a.g.length)rows+=`<div class="irow"><span class="ic">${ic.ball}</span><div class="tx" style="flex:1"><div class="lb">Goles</div><ul class="goals">${a.g.map(g=>`<li class="${g[2]===c.me?"me":""}"><span class="min">${g[0]}'</span><span>${esc(g[1])}</span></li>`).join("")}</ul></div></div>`;
  const note=c.markerOnly&&played?`<div class="note">En benjamín la RFFM no publica el marcador real: pone 1-0 al ganador y 0-0 si hay empate.</div>`:"";
  return `<div class="match"><div class="mgrid">${side(m.h)}<div class="score">${center}</div>${side(m.a)}</div>${note}</div><section class="info"><h3>INFORMACIÓN</h3>${rows}</section>`;
}

function resultsView(c){
  if(!c.J.length)return `<div class="empty"><b>Sin resultados publicados</b>${esc(c.scorersNote||"La RFFM aún no ha publicado partidos de este grupo.")}</div>`;
  const j=c.J[S.jr-1];
  const anyTime=j.ms.some(m=>m.t);
  const sorted=[...j.ms].sort((x,y)=>(x.d+(x.t||"")).localeCompare(y.d+(y.t||""),undefined,{numeric:true}));
  const ms=anyTime?sorted:j.ms;
  const row=m=>{
    const mid=m.hg!=null?`<span class="sc">${m.hg} - ${m.ag}</span><span class="dt">${m.d!==j.date?dayShort(c,m.d)+" · ":""}${m.t}h</span>`:m.t?`<span class="hr">${m.t}h</span>${m.d!==j.date?`<span class="dt">${dayShort(c,m.d)}</span>`:""}${m.hg==null&&toDate(c,m.d)<TODAY?'<span class="dt">Sin resultado</span>':""}`:`<span class="hr" style="color:var(--muted)">--:--</span><span class="dt">Pendiente</span>`;
    const vn=m.v&&!c.markerOnly?`<span class="vn">${esc(m.v)}</span>`:"";
    return `<div class="rrow ${m.h===c.me||m.a===c.me?"mine":""}"><div class="rt">${shirt(c.teams[m.h],54)}<span>${esc(nm(c,m.h))}</span></div><div class="rmid">${mid}${vn}</div><div class="rt">${shirt(c.teams[m.a],54)}<span>${esc(nm(c,m.a))}</span></div></div>`;
  };
  const sede=c.markerOnly?`<div class="restline">Sede: ${esc(j.ms[0].v||c.futureVenue)}</div>`:"";
  const rest=j.rest?`<div class="restline">Descansa: <b style="color:var(--fg)">${esc(nm(c,j.rest))}</b></div>`:"";
  const note=c.markerOnly?`<p class="foot">En benjamín la RFFM solo indica quién gana (1-0) o si hay empate (0-0).</p>`:"";
  return `<div class="day">${dayHeader(c,j.date)}</div><div class="list">${ms.map(row).join("")}${rest}${sede}</div>${note}`;
}

function tableView(c){
  const st=standings(c);
  const zc={up:"var(--accent)",warn:"var(--warn)",down:"var(--bad)"};
  const sub=`<div class="sub" role="tablist"><button data-sub="clas" aria-selected="${S.sub==="clas"}">Clasificación</button><button data-sub="det" aria-selected="${S.sub==="det"}">Detalles</button></div>`;
  let out;
  if(S.sub==="clas"){
    out=`<div class="list" style="border-top:1px solid var(--line);border-radius:12px"><div class="chead" style="background:var(--fg);color:#13303b;font-weight:600;font-size:13px;padding-block:9px;cursor:default"><span class="p"></span><span class="n">EQUIPO</span><span class="pt">PTS</span><span style="width:16px"></span></div>${st.map((r,i)=>{
      const pos=i+1,z=c.zones[pos],open=S.open===r.k;
      return `<div class="crow ${r.k===c.me?"me":""}"><button class="chead" data-open="${r.k}" aria-expanded="${open}">${z?`<span class="zone" style="background:${zc[z]}"></span>`:""}<span class="p">${pos}.</span><span class="n">${esc(nm(c,r.k))}</span><span class="pt">${r.pts}</span><span class="chev">⌄</span></button>${open?`<div class="cdet"><div class="stats"><span>PJ <b>${r.pj}</b></span><span>PG <b>${r.pg}</b></span><span>PE <b>${r.pe}</b></span><span>PP <b>${r.pp}</b></span><span>GF <b>${r.gf}</b></span><span>GC <b>${r.gc}</b></span></div><div class="form" aria-label="Resultados por jornada">${r.form.map(f=>`<i class="${f}">${{W:"G",D:"E",L:"P"}[f]}</i>`).join("")||'<span style="color:var(--muted)">Sin partidos</span>'}</div></div>`:""}</div>`;
    }).join("")}</div>`;
  }else{
    out=`<div class="scroll"><table class="tbl"><thead><tr><th></th><th>EQUIPO</th><th>PTS</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th></tr></thead><tbody>${st.map((r,i)=>{const z=c.zones[i+1];return `<tr class="${r.k===c.me?"me":""}"><td class="ps">${z?`<span class="zone" style="background:${zc[z]}"></span>`:""}${i+1}.</td><td class="tm">${esc(nm(c,r.k))}</td><td class="pts">${r.pts}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td></tr>`}).join("")}</tbody></table></div>`;
  }
  const leg=c.zoneLegend.length?`<div class="legend">${c.zoneLegend.map(([col,l])=>`<span style="--c:${col}">${l}</span>`).join("")}</div>`:"";
  const note=c.markerOnly?`<p class="foot">En benjamín GF y GC cuentan partidos ganados y perdidos, no goles reales.</p>`:"";
  return sub+out+leg+note;
}

function scorersView(c){
  if(!c.scorers.length)return `<div class="empty"><b>Sin tabla de goleadores</b>${c.scorersNote}</div>`;
  const rows=c.scorers.map((r,i)=>({pos:i+1,r})).filter(x=>!S.onlyMe||x.r[1]===c.me);
  const av='<svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="15" r="7" fill="#8a9599"/><path d="M6 40c2-9 8-13 14-13s12 4 14 13z" fill="#8a9599"/></svg>';
  return `<div class="filters"><button class="chip" data-only="0" aria-pressed="${!S.onlyMe}">Todo el grupo</button><button class="chip" data-only="1" aria-pressed="${S.onlyMe}">Solo Escolapios</button></div>
  <div class="list" style="border-top:1px solid var(--line);border-radius:12px">${rows.map(({pos,r})=>`<div class="grow ${r[1]===c.me?"me":""}"><span class="pos">${pos}</span><span class="av">${av}</span><div class="pl"><b>${esc(r[0])}</b><span>${esc(nm(c,r[1]))}</span></div><span class="gl">${r[2]}${r[3]?` <small>(${r[3]}p)</small>`:""}</span></div>`).join("")}</div>
  <p class="foot">Posición tal y como la publica la RFFM tras la jornada 4.</p>`;
}

function squadView(c){
  const goals={};c.scorers.forEach(r=>{if(r[1]===c.me)goals[r[0]]=r[2]});
  const av='<svg viewBox="0 0 40 40" width="36" height="36" style="border-radius:50%;background:#cfd8dc;flex:none"><circle cx="20" cy="15" r="7" fill="#8a9599"/><path d="M6 40c2-9 8-13 14-13s12 4 14 13z" fill="#8a9599"/></svg>';
  return `<div class="sec">JUGADORES (${c.squad.length})</div><div class="plist">${c.squad.map(p=>`<div class="prow">${av}<span class="nm">${esc(p)}</span>${goals[p]?`<span class="gtag">${goals[p]} ${goals[p]>1?"goles":"gol"}</span>`:""}</div>`).join("")}</div>
  <div class="sec">DELEGADO</div><div class="plist">${c.delegates.map(p=>`<div class="prow">${av}<span class="nm">${esc(p)}</span></div>`).join("")}</div>
  <p class="foot">La RFFM no distingue porteros en la ficha del equipo. Campo de casa: ${esc(c.home)}.</p>`;
}

app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.upd!==undefined){forceUpdate(t.dataset.upd);return}
  const keep=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};
  if(t.dataset.fav){const k=t.dataset.fav;if(FAV.list.includes(k)){S.confirm=k;keep();return}FAV.list=[...FAV.list,k];saveFav();keep();return}
  if(t.dataset.unfav){const k=t.dataset.unfav;FAV.list=FAV.list.filter(x=>x!==k);S.confirm=null;saveFav();keep();return}
  if(t.dataset.cancel){S.confirm=null;keep();return}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();window.scrollTo(0,0)}
  else if(t.dataset.goj){S.jj=+t.dataset.goj;S.tab="jornada";render();window.scrollTo(0,0)}
  else if(t.dataset.j){const[k,n]=t.dataset.j.split(":");S[k]=+n;render()}
  else if(t.dataset.sub){S.sub=t.dataset.sub;render()}
  else if(t.dataset.open){S.open=S.open===t.dataset.open?null:t.dataset.open;render()}
  else if(t.dataset.only){S.onlyMe=t.dataset.only==="1";render()}
});

app.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const r=document.getElementById("sres");if(r)r.innerHTML=searchResults(S.q)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.confirm){S.confirm=null;const y=window.scrollY;render();window.scrollTo(0,y)}});
app.addEventListener("click",e=>{if(e.target.classList&&e.target.classList.contains("modal")){S.confirm=null;const y=window.scrollY;render();window.scrollTo(0,y)}});
app.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details.all"))S.allOpen=e.target.open},true);
Object.values(COMPS).forEach(build);
route();
</script>
